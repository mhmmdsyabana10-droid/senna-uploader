<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Senna Uploader TikTok Login</title>
<style>body{font:16px/1.6 system-ui,sans-serif;max-width:680px;margin:40px auto;padding:0 16px;color:#222;background:#fff}code{display:block;word-break:break-all;background:#f2f2f2;padding:12px;border-radius:6px}</style></head>
<body>
<h1>TikTok login</h1>
<p id="msg">Reading the response…</p>
<code id="code"></code>
<script>
const q = new URLSearchParams(location.search);
if ((q.get('state') || '').startsWith('local')) { location.replace('http://127.0.0.1:8790/callback' + location.search); }
const m = document.getElementById('msg'), c = document.getElementById('code');
if (q.get('code')) { m.textContent = 'Login succeeded. Authorization code (state ' + (q.get('state') || '-') + '):'; c.textContent = q.get('code'); }
else { m.textContent = 'Login failed or was cancelled.'; c.textContent = (q.get('error') || '') + ' ' + (q.get('error_description') || ''); }
</script>
<p><a href="index.html">Home</a></p>
</body></html>
